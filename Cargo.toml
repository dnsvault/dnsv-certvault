[package]
name = "dnsvcert"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dns-update = "0.5.6"
instant-acme = { version = "0.8.5", features = ["rcgen"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
x509-parser = "0.18.1"
