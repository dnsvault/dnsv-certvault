[package]
name = "dnsvcert"
version = "0.1.4"
edition = "2024"
license-file = "LICENSE"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dns-update = { version = "0.5.6", default-features = false }
hickory-net = { version = "0.26.1", default-features = false }
hickory-proto = { version = "0.26.1", default-features = false }
instant-acme = { version = "0.8.5", default-features = false, features = ["rcgen", "hyper-rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
x509-parser = "0.18.1"

[features]
# Crypto backend. aws-lc-rs is the default and keeps reqwest on rustls (pure Rust).
# `--no-default-features --features ring` is an escape hatch where aws-lc's C build
# fails — note dns-update's ring feature switches reqwest to native-tls (OpenSSL).
default = ["aws-lc-rs"]
aws-lc-rs = ["instant-acme/aws-lc-rs", "dns-update/aws-lc-rs", "hickory-proto/dnssec-aws-lc-rs", "hickory-net/dnssec-aws-lc-rs"]
ring = ["instant-acme/ring", "dns-update/ring", "hickory-proto/dnssec-ring", "hickory-net/dnssec-ring"]

[profile.release]
strip = true
lto = true
